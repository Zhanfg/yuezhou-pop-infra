name: VPS CI and Cloudflare deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axymorrsen-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, axymorrsen-ci]
    timeout-minutes: 35
    env:
      CONTENT_REMOTE_REQUIRED: "false"
      CI: "true"
      QA_BASE_URL: http://127.0.0.1:4321
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate API contract
        run: npm run check:api

      - name: Install Playwright Chromium
        # Install OS libraries once on the VPS before enabling this workflow.
        # The CI account must remain outside sudo/docker-equivalent groups.
        run: npx playwright install chromium

      - name: Run repository QA scripts against preview
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 --port 4321 > artifacts/preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4321/ >/dev/null

          for script in \
            scripts/qa-home-interactions.mjs \
            scripts/qa-route-layout.mjs \
            scripts/qa-content-layout.mjs \
            scripts/qa-mobile-header.mjs \
            scripts/qa-floating-bars.mjs \
            scripts/qa-motion-regressions.mjs; do
            if [[ -f "$script" ]]; then
              node "$script"
            fi
          done

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axymorrsen-site-qa-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove generated local secrets
        if: always()
        shell: bash
        run: |
          rm -f .env .env.* .dev.vars .dev.vars.* 2>/dev/null || true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, linux, x64, axymorrsen-deploy]
    timeout-minutes: 30
    environment: production
    env:
      CI: "true"
      CONTENT_REPOSITORY: Zhanfg/axymorrsen-content
      CONTENT_REF: main
      CONTENT_REMOTE_REQUIRED: "true"
      GITHUB_CONTENT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify production secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GITHUB_CONTENT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production environment secret: $name"
              exit 1
            fi
          done

      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build trusted production output
        run: npm run build

      - name: Validate API contract
        run: npm run check:api

      - name: Validate Wrangler package
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy with Wrangler
        run: npx --yes wrangler@4 deploy

      - name: Remove generated local secrets
        if: always()
        shell: bash
        run: |
          rm -f .env .env.* .dev.vars .dev.vars.* 2>/dev/null || true
