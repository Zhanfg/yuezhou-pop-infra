name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Run ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            if [[ "$script" == "./vps-control/install-github-runner.sh" ]]; then
              # The single-quoted child-shell program intentionally expands
              # $1 and $@ inside the child bash, not in the installer shell.
              shellcheck --exclude=SC2016 "$script"
            else
              shellcheck "$script"
            fi
          done < <(find . -type f -name '*.sh' -print0)

      - name: Reject committed private keys
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE --exclude-dir=.git \
            'BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY' .; then
            echo 'Private key material must never be committed.' >&2
            exit 1
          fi

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          sed -i 's/GENERATED_ON_INSTALL/test-only-placeholder/g' .env
          docker compose --env-file .env -f compose.yaml config --quiet
