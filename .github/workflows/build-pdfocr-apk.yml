name: Build PDF OCR APK

on:
  push:
    branches:
      - build/pdf-ocr-apk-20260802
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Decode source project
        shell: bash
        run: |
          set -euo pipefail
          cat pdfocr-build-payload/part*.b64 | base64 -d > /tmp/PdfOcrBookApp.zip
          echo "fe060d791f7e73e8f9c31f121b33ae7c305278aa0a675cdcb1710bb3e6160966  /tmp/PdfOcrBookApp.zip" | sha256sum -c -
          mkdir -p /tmp/pdfocr
          unzip -q /tmp/PdfOcrBookApp.zip -d /tmp/pdfocr
          test -f /tmp/pdfocr/PdfOcrBookApp/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/pdfocr/PdfOcrBookApp
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/pdfocr/PdfOcrBookApp/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/PDF智能拆书OCR-v1.0.0-debug.apk
          sha256sum /tmp/PDF智能拆书OCR-v1.0.0-debug.apk > /tmp/PDF智能拆书OCR-v1.0.0-debug.apk.sha256
          ls -lh /tmp/PDF智能拆书OCR-v1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF智能拆书OCR-APK
          path: |
            /tmp/PDF智能拆书OCR-v1.0.0-debug.apk
            /tmp/PDF智能拆书OCR-v1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
